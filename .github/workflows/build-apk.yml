name: Build APK

on:
  push:
    branches: [main, development]
    tags: ["v*"]
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    branches: [development]
    paths:
      - "app/**"

permissions:
  contents: write # needed for `gh release create` on a tag push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Verify the pinned SHA matches the v2 tag before using it.
      # This step's output provides independent evidence for the reviewer.
      - name: Verify flutter-action v2 tag points to pinned SHA
        id: verify-sha
        run: |
          echo "Fetching v2 tag target from subosito/flutter-action..."
          TAG_SHA=$(gh api repos/subosito/flutter-action/git/ref/tags/v2 --jq .object.sha)
          echo "v2 tag resolves to: $TAG_SHA"
          PINNED_SHA="1a449444c387b1966244ae4d4f8c696479add0b2"
          if [ "$TAG_SHA" = "$PINNED_SHA" ]; then
            echo "✓ Verified: v2 tag matches pinned SHA"
            echo "verified=true" >> $GITHUB_OUTPUT
          else
            echo "✗ MISMATCH: v2 tag ($TAG_SHA) != pinned SHA ($PINNED_SHA)"
            echo "verified=false" >> $GITHUB_OUTPUT
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # Pinned to the commit SHA of the subosito/flutter-action v2 tag
      # (1a449444c387b1966244ae4d4f8c696479add0b2), resolved live via
      # `gh api repos/subosito/flutter-action/git/ref/tags/v2` on
      # 2026-10-12. NEVER pin a SHA you have not resolved (SonarCloud S7637).
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      # android/ is not committed (see app/README.md) — generated fresh here so it
      # always matches whatever Flutter/Gradle/Kotlin versions this step installs.
      # Safe to run against an existing project: it only adds the missing platform
      # folder, it does not touch lib/ or pubspec.yaml.
      - name: Generate Android platform scaffold
        working-directory: app
        run: flutter create --platforms=android --project-name=memory_diary --org=com.harithkavish .

      # Recent Flutter templates only add android.permission.INTERNET to the debug
      # manifest (android/app/src/debug/AndroidManifest.xml), not the release one -
      # without it the release APK can't make any network request at all, and Android
      # reports that as a misleading "Failed host lookup" SocketException that looks
      # exactly like a DNS problem. Confirmed missing via `aapt dump permissions` on
      # the actual v0.1.0 release APK. Patch it into the real (main) manifest here
      # since android/ isn't committed and gets regenerated fresh every build.
      - name: Ensure INTERNET permission is in the release manifest
        working-directory: app
        run: |
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || \
            sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET"/>' \
              android/app/src/main/AndroidManifest.xml
          grep 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Build release APK
        working-directory: app
        # WORKER_BASE_URL is a repository *variable*, not a secret — it's the Worker's
        # public HTTPS URL, safe to compile into a public APK.
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ vars.WORKER_BASE_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: memory-diary-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            app/build/app/outputs/flutter-apk/app-release.apk
